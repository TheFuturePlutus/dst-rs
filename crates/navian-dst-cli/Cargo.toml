[package]
name = "navian-dst-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
description = "CLI for navian-dst deterministic simulation testing: a determinism-leak scanner (SARIF/baseline), a seam-safe time-migration codemod, a run-twice determinism check, an invariant-presence gate, and an adversarial invariant critique."
repository = "https://github.com/TheFuturePlutus/navian-dst"
homepage = "https://github.com/TheFuturePlutus/navian-dst"
readme = "README.md"
keywords = ["deterministic", "simulation", "testing", "cli", "invariants"]
categories = ["development-tools::testing", "command-line-utilities"]

[[bin]]
name = "navian-dst"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
