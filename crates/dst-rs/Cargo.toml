[package]
name = "dst-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A domain-agnostic deterministic-simulation-testing (DST) substrate: harness-controlled time, RNG, network, executor, fault schedules, invariant checking, and trace shrinking."
repository = "https://github.com/navian-ai/dst-rs"
homepage = "https://github.com/navian-ai/dst-rs"
readme = "README.md"
keywords = ["deterministic", "simulation", "testing", "dst", "fault-injection"]
categories = ["development-tools::testing", "simulation", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
async-trait = "0.1"
rand = "0.8"
rand_chacha = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
