[package]
name = "dst-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Command-line tools for the dst-rs deterministic-simulation-testing substrate: a determinism-leak scanner and a seam-safe time-migration rewriter."
repository = "https://github.com/navian-ai/dst-rs"
homepage = "https://github.com/navian-ai/dst-rs"
readme = "README.md"
keywords = ["deterministic", "simulation", "testing", "cli", "codemod"]
categories = ["development-tools::testing", "command-line-utilities"]

[[bin]]
name = "dst"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
