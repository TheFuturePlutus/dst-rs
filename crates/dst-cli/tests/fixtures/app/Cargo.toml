# Fixture crate for the `dst migrate` integration test.
#
# This is a REAL, compiling crate that depends on dst-rs. The integration test
# copies it to a temp dir, rewrites the `dst-rs` path to an absolute one, and
# migrates the COPY — so this committed source stays pristine.
#
# The empty `[workspace]` table makes this its own workspace root so the parent
# dst-rs workspace never tries to absorb it as a member.
[workspace]

[package]
name = "app"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Rewritten to an absolute path by the integration test. The committed relative
# path points at crates/dst-rs from this file's location.
dst-rs = { path = "../../../../dst-rs" }
tokio = { version = "1", features = ["time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "macros"] }
